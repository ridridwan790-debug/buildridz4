name: Build Flutter APK Debug & Release

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih tipe build'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release

permissions:
  contents: read

jobs:
  build-debug:
    if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
        
    - name: Flutter Pub Get
      run: flutter pub get
      
    - name: Build APK Debug
      run: flutter build apk --debug
      
    - name: Upload APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk

  build-release:
    if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == ''
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
        
    - name: Flutter Pub Get
      run: flutter pub get
      
    - name: Build APK Release
      run: flutter build apk --release --split-per-abi
      
    - name: Upload APK Release
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 30
