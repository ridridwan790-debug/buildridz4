name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Payload JSON'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # untuk hapus release/tag

    steps:
      - name: Parse payload
        id: parse
        run: |
          URL=$(echo '${{ inputs.payload }}' | jq -r '.url')
          BUILD_TYPE=$(echo '${{ inputs.payload }}' | jq -r '.buildType // "release"')
          TAG=$(echo '${{ inputs.payload }}' | jq -r '.tag')
          echo "URL=$URL" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Download source
        run: |
          wget -O source.zip "$URL"
          unzip source.zip -d project

      - name: Get dependencies
        run: |
          cd project
          flutter pub get

      - name: Build APK
        run: |
          cd project
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          else
            flutter build apk --release
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: project/${{ env.APK_PATH }}

      - name: Delete temporary release and tag
        if: always()
        run: |
          gh release delete "$TAG" --repo ${{ github.repository }} --yes || true
          git push --delete origin "$TAG" || true
        env:
          GH_TOKEN: ${{ github.token }}
